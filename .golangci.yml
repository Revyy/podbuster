version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - misspell
    - modernize
    - nolintlint
    - unconvert
  settings:
    depguard:
      rules:
        game-layer:
          files:
            - "**/game/**"
          deny:
            - pkg: github.com/revyy/podbuster/cluster
              desc: game/ talks to the cluster only through the typed channels in game/events.go
            - pkg: github.com/revyy/podbuster/bridge
              desc: game/ talks to the bridge only through the typed channels in game/events.go

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/revyy/podbuster

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
