---
apiVersion: batch/v1
kind: Job
metadata:
  name: target-job
  labels:
    app.kubernetes.io/name: podbuster-target
    app.kubernetes.io/instance: target-job
    app.kubernetes.io/part-of: podbuster
    podbuster.github.com/chaos-playground: "true"
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podbuster-target
        app.kubernetes.io/instance: target-job
        app.kubernetes.io/part-of: podbuster
        podbuster.github.com/chaos-playground: "true"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
