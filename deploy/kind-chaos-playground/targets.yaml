apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-1
  labels:
    app.kubernetes.io/name: podbuster-target
    app.kubernetes.io/instance: target-1
    app.kubernetes.io/part-of: podbuster
    podbuster.github.com/chaos-playground: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podbuster-target
      app.kubernetes.io/instance: target-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podbuster-target
        app.kubernetes.io/instance: target-1
        app.kubernetes.io/part-of: podbuster
        podbuster.github.com/chaos-playground: "true"
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
